<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" shape-rendering="geometricPrecision">
  <!--
    PEAK DOWNLOAD — MONOCHROME WHITE v5
    Transparent background. Use on dark or colored surfaces.
    Single hue (white) at three opacities keeps the
    layered-peak silhouette readable without accent color.
  -->
  <polygon points="200,92 88,304 312,304" fill="#FFFFFF" fill-opacity="1"/>
  <polygon points="140,176 60,304 256,304" fill="#FFFFFF" fill-opacity="0.72"/>
  <polygon points="262,192 152,304 340,304" fill="#FFFFFF" fill-opacity="0.48"/>
</svg>
