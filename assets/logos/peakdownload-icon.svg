<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" shape-rendering="geometricPrecision">
  <!--
    PEAK DOWNLOAD — ICON MARK v5 (layered mountain)
    ──────────────────────────────────────────────
    Three overlapping triangles sharing a common baseline (y=304),
    tallest peak in back, two shorter ridges layered in front.
    Painted back-to-front: white summit, Alpine Blue, Sky Cyan.

    Colors:
      Background: #020617 (Night)
      Back peak:  #F4F7FB (Summit White)
      Mid peak:   #2563EB (Alpine Blue)
      Front peak: #06B6D4 (Sky Cyan)
  -->
  <rect width="400" height="400" fill="#020617" rx="84"/>
  <polygon points="200,92 88,304 312,304" fill="#F4F7FB"/>
  <polygon points="140,176 60,304 256,304" fill="#2563EB"/>
  <polygon points="262,192 152,304 340,304" fill="#06B6D4"/>
</svg>
